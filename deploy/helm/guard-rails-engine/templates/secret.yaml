{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "gre.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gre.fullname" . }}
  labels:
    {{- include "gre.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $secret := .Values.secret.values.GUARDRAILS_SECRET }}
  {{- if not $secret }}
  {{- if and $existing (index $existing.data "GUARDRAILS_SECRET") }}
  {{- $secret = index $existing.data "GUARDRAILS_SECRET" | b64dec }}
  {{- else }}
  {{- $secret = randAlphaNum 64 }}
  {{- end }}
  {{- end }}
  # Kept across upgrades: a new value would invalidate every pending approval.
  GUARDRAILS_SECRET: {{ $secret | quote }}
  {{- range $k, $v := .Values.secret.values }}
  {{- if and (ne $k "GUARDRAILS_SECRET") $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
