name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For a security vulnerability, use SECURITY.md instead of this form.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or requests that shows the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove API keys and personal data first.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "`grctl version`, or the image tag"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - Docker
        - Docker Compose
        - Kubernetes
        - Binary
        - Go library
        - From source
    validations:
      required: true
