name: release

# Pushing a tag such as v0.1.0 publishes everything from that commit:
#
#   Go module      nothing to do: the tag is the release (go get ...@v0.1.0)
#   binaries       attached to a GitHub Release, with checksums
#   Docker image   ghcr.io/vicoaritonang/guard-rails-engine, amd64 and arm64
#   Python, npm    only when the PUBLISH_PYPI / PUBLISH_NPM repository variables
#                  are "true". See CONTRIBUTING.md for the one-time setup.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Check the SDK versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" sdks/python/pyproject.toml \
            || { echo "sdks/python/pyproject.toml is not at $version"; exit 1; }
          grep -q "\"version\": \"$version\"" sdks/js/package.json \
            || { echo "sdks/js/package.json is not at $version"; exit 1; }

  binaries:
    name: binaries
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            dir="guard-rails-engine_${GITHUB_REF_NAME}_${os}_${arch}"
            mkdir -p "dist/$dir"
            for cmd in server grctl; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/$dir/$cmd$ext" "./cmd/$cmd"
            done
            cp -r LICENSE README.md config/policies "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
            rm -rf "dist/$dir"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  image:
    name: container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless image signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vicoaritonang/guard-rails-engine
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            RUN_TESTS=false
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/vicoaritonang/guard-rails-engine@${DIGEST}"

  pypi:
    name: python package
    needs: verify
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing: no token is stored in the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        working-directory: sdks/python
        run: |
          python -m pip install build
          python -m build --outdir ../../dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    name: npm package
    needs: verify
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing: no token is stored in the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: sdks/js
        run: npm publish --provenance --access public
