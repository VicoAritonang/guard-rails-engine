[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "guard-rails-engine"
version = "0.1.0"
description = "Python client for Guardrails Engine: check prompts, tool calls and model output against a guardrails gateway."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Vico Aritonang" }]
keywords = ["llm", "guardrails", "prompt-injection", "pii", "ai-safety", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/VicoAritonang/guard-rails-engine"
Issues = "https://github.com/VicoAritonang/guard-rails-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/guard_rails_engine"]
