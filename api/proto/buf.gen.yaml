# Generates the Go stubs into pkg/api/guardrailsv1. Clients in other languages
# generate their own from the same file; see docs/api.md.
version: v2
managed:
  enabled: false
plugins:
  - local: protoc-gen-go
    out: ../../pkg/api
    opt: module=go.vicoworks.com/guard-rails/pkg/api
  - local: protoc-gen-go-grpc
    out: ../../pkg/api
    opt:
      - module=go.vicoworks.com/guard-rails/pkg/api
      - require_unimplemented_servers=true
