# Model catalog: the aliases a client may request, the upstream that serves
# each one, and where to go when that upstream is unavailable.
#
# Point GUARDRAILS_MODELS at this file. Routes whose provider has no credentials
# are dropped at startup and listed in the log, so this file can name every
# model the team uses while a developer runs with a single key.
#
# A client may also bypass the catalog with "provider:model", e.g.
# "groq:openai/gpt-oss-20b". A colon, not a slash: Groq's own ids contain
# slashes, and "openai/..." would be ambiguous between a provider and a family.
#
# max_tokens matters on Groq: it reserves max_completion_tokens against the
# tokens-per-minute limit before generating, so an oversized default exhausts
# a free-tier minute in a single request.
default: gpt-5-mini

models:
  # --- OpenAI -----------------------------------------------------------------
  gpt-5-mini:
    provider: openai
    model: gpt-5-mini
    effort: minimal
    max_tokens: 2048
    tier: medium
    fallbacks: [gpt-oss-120b]
    description: General purpose; falls back to Groq on an OpenAI outage.
  gpt-5-nano:
    provider: openai
    model: gpt-5-nano
    effort: minimal
    max_tokens: 2048
    tier: small
    fallbacks: [gpt-oss-20b]
  gpt-4.1-nano:
    provider: openai
    model: gpt-4.1-nano
    max_tokens: 1024
    tier: small
    description: Non-reasoning, lowest latency OpenAI model.
  gpt-4.1-mini:
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 1024
    tier: medium
  gpt-5:
    provider: openai
    model: gpt-5
    effort: low
    max_tokens: 4096
    tier: large
    fallbacks: [gpt-oss-120b]

  # --- Groq ---------------------------------------------------------------------
  gpt-oss-20b:
    provider: groq
    model: openai/gpt-oss-20b
    effort: low
    max_tokens: 1024
    tier: small
    fallbacks: [gpt-5-nano]
  gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    effort: low
    max_tokens: 1024
    tier: medium
    fallbacks: [gpt-5-mini]
  qwen3-27b:
    provider: groq
    model: qwen/qwen3.8-27b
    max_tokens: 1024
    tier: medium
    fallbacks: [gpt-4.1-mini]

  # --- Safety classifiers (used by the semantic tier, not for chat) -------------
  prompt-guard-86m:
    provider: groq
    model: meta-llama/llama-prompt-guard-2-86m
    max_tokens: 16              # the model caps completions at 512; it emits one number
    tier: classifier
    description: Injection/jailbreak classifier; returns a probability.
  prompt-guard-22m:
    provider: groq
    model: meta-llama/llama-prompt-guard-2-22m
    max_tokens: 16
    tier: classifier
  safeguard-20b:
    provider: groq
    model: openai/gpt-oss-safeguard-20b
    effort: low
    max_tokens: 300             # reserved against Groq's tokens-per-minute limit
    tier: classifier
    description: Policy-following safety reasoner; the policy is in the prompt.
